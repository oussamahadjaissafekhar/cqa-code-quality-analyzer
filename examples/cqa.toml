schema_version = 1

[discover]
include = ["**/*.{py,ts,tsx,js,jsx}"]
exclude = [
  "**/node_modules/**",
  "**/.git/**",
  "**/dist/**",
  "**/.venv/**",
  "**/__pycache__/**",
]
use_gitignore = true

[parser]
languages = ["python", "typescript", "javascript"]
timeout_s = 120
jobs = 0

[rules]
disable = []

[thresholds]
fail_on = "high"

[report]
formats = ["json"]
sarif = false
