[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cqa"
version = "0.1.0"
description = "Code Quality Analyzer - static quality and security checks with a CI-friendly CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CQA Maintainers" }]
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.6,<3",
    "jsonschema>=4.20,<5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cqa = "cqa.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cqa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "node: requires a built TypeScript parser (npm run build)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
packages = ["cqa"]
mypy_path = "src"
